<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Two Stone Showdown</title>
<meta name="description" content="Ian vs Joe vs Sam. 9 weeks. 2 stone each. Weigh-in every Monday.">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0b0d12;--bg2:#11141b;--card:rgba(255,255,255,.035);--card2:rgba(255,255,255,.06);
  --line:rgba(255,255,255,.08);--text:#eef1f6;--mute:#8b93a3;--dim:#555d6d;
  --ian:#2f7bff;--joe:#ff3b47;--gold:#ffc94d;--good:#3ddc97;--bad:#ff8a5b;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif;
  min-height:100vh;line-height:1.45;overflow-x:hidden;
  background-image:
    radial-gradient(900px 600px at -10% -10%,rgba(47,123,255,.22),transparent 60%),
    radial-gradient(900px 600px at 110% -10%,rgba(255,59,71,.20),transparent 60%);
  background-attachment:fixed;
}
.wrap{max-width:980px;margin:0 auto;padding:28px 16px 60px}
header{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.logo{width:52px;height:52px;border-radius:14px;flex:none;cursor:pointer;user-select:none;
  background:linear-gradient(135deg,var(--ian),var(--joe));display:grid;place-items:center;
  box-shadow:0 8px 30px rgba(0,0,0,.4);transition:transform .15s}
.logo:active{transform:scale(.92)}
.logo svg{width:28px;height:28px}
h1{font-family:Anton,Impact,sans-serif;font-weight:400;letter-spacing:.02em;
  font-size:clamp(28px,6vw,46px);line-height:.95;text-transform:uppercase}
h1 .vs-i{color:var(--ian)}h1 .vs-j{color:var(--joe)}
.sub{color:var(--mute);font-size:14px;font-weight:600;margin-top:4px}

.status{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.pill{background:var(--card2);border:1px solid var(--line);border-radius:999px;
  padding:7px 14px;font-size:13px;font-weight:700;color:var(--mute)}
.pill b{color:var(--text)}
.pill.hot{background:var(--gold);color:#1a1300;border-color:transparent}
.pill.hot b{color:#1a1300}

.banner{border-radius:20px;padding:20px 22px;margin-bottom:16px;border:1px solid var(--line);
  background:linear-gradient(90deg,color-mix(in srgb,var(--lc,#fff) 22%,transparent),var(--card));
  display:flex;align-items:center;gap:14px}
.banner .t{font-family:Anton,sans-serif;font-size:clamp(24px,5vw,36px);text-transform:uppercase;line-height:1}
.banner .t em{font-style:normal;color:var(--lc,var(--text))}
.banner .s{color:var(--mute);font-size:14px;font-weight:600;margin-top:4px}
.banner .ico{font-size:34px;line-height:1}

.share{display:block;margin:-6px 0 16px auto;border:0;border-radius:999px;background:#25d366;color:#05210f;
  font:800 13px Manrope,sans-serif;padding:9px 16px;cursor:pointer}
.demo{background:rgba(255,201,77,.1);border:1px dashed rgba(255,201,77,.5);color:var(--gold);
  border-radius:12px;padding:10px 14px;font-size:13px;font-weight:700;margin-bottom:16px}

.players{display:grid;grid-template-columns:1fr 1fr;gap:12px;position:relative;margin-bottom:16px}
.players[data-n="3"]{grid-template-columns:repeat(3,1fr)}
.players[data-n="4"]{grid-template-columns:repeat(2,1fr)}
.vs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;
  width:46px;height:46px;border-radius:50%;background:var(--bg);border:2px solid var(--line);
  display:grid;place-items:center;font-family:Anton,sans-serif;font-size:17px;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.player{border-top:4px solid var(--c);position:relative;overflow:hidden}
.player:before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(400px 200px at 50% -20%,color-mix(in srgb,var(--c) 22%,transparent),transparent 70%)}
.p-head{display:flex;align-items:center;gap:8px;position:relative;flex-wrap:wrap}
.p-head h2{font-size:17px;font-weight:800}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c)}
.crown{margin-left:auto;font-size:10px;font-weight:800;letter-spacing:.12em;color:#1a1300;
  background:var(--gold);padding:3px 8px;border-radius:999px}
.big{display:flex;align-items:baseline;gap:8px;margin:14px 0 2px;position:relative}
.big .num{font-family:Anton,sans-serif;font-size:clamp(42px,9vw,64px);line-height:.9;color:var(--c);white-space:nowrap}
.big .num small{font-size:.45em;margin-left:2px;opacity:.85}
.big .unit{font-weight:800;color:var(--mute);font-size:14px;text-transform:uppercase;letter-spacing:.06em}
.alt{color:var(--mute);font-size:13px;font-weight:600;min-height:19px;position:relative}
.bar{height:12px;border-radius:999px;background:rgba(255,255,255,.07);margin:14px 0 6px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:999px;background:var(--c);
  box-shadow:0 0 16px var(--c);transition:width 1s cubic-bezier(.2,.8,.2,1)}
.bar-l{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--mute);position:relative}
dl{display:grid;grid-template-columns:1fr auto;gap:8px 10px;margin-top:16px;font-size:14px;position:relative}
dt{color:var(--mute);font-weight:600}dd{font-weight:800;text-align:right}

.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.sec-h h3{font-family:Anton,sans-serif;font-weight:400;font-size:22px;text-transform:uppercase;letter-spacing:.02em}
.toggle{display:flex;background:rgba(255,255,255,.06);border-radius:999px;padding:3px}
.toggle button{border:0;background:none;color:var(--mute);font:700 13px Manrope,sans-serif;
  padding:7px 14px;border-radius:999px;cursor:pointer}
.toggle button.on{background:var(--text);color:var(--bg)}
.chart-box{position:relative;height:340px}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:13px;font-weight:700;color:var(--mute)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:18px;height:3px;border-radius:2px;background:var(--c)}
.legend i.dash{background:repeating-linear-gradient(90deg,var(--c) 0 4px,transparent 4px 7px)}

.table-wrap{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:460px}
th{text-align:left;color:var(--mute);font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;
  padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:11px 6px;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
tr.future td{color:var(--dim)}
tr.now td{background:rgba(255,201,77,.06)}
td .wk{font-family:Anton,sans-serif;font-weight:400;font-size:16px}
td .dt{color:var(--mute);font-weight:600;font-size:12px;display:block}
.chg{font-size:12px;font-weight:800;margin-left:6px;padding:2px 6px;border-radius:6px}
.chg.down{color:var(--good);background:rgba(61,220,151,.1)}
.chg.up{color:var(--bad);background:rgba(255,138,91,.1)}
.win{display:inline-flex;align-items:center;gap:5px;font-size:13px}
.win i{width:8px;height:8px;border-radius:50%;background:var(--c)}

.stack{display:grid;gap:16px}
footer{text-align:center;color:var(--dim);font-size:12px;font-weight:600;margin-top:30px}
footer a{color:var(--dim);text-decoration:none;padding:6px}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);
  padding:10px 16px;border-radius:999px;font-weight:800;font-size:13px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

@media(max-width:560px){
  .player{padding:16px 14px}
  dl{font-size:12.5px;gap:6px}
  .p-head h2{font-size:14px}
  .crown{margin-left:0}
  .vs{width:36px;height:36px;font-size:14px}
  .chart-box{height:280px}
  .banner{padding:16px}
  .players[data-n="3"]{grid-template-columns:1fr}
  .players[data-n="3"] .player{padding:16px 18px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo" id="logo" title="Two Stone Showdown">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M8 9a5 5 0 0 1 8 0"/><path d="M12 9l1.5-2"/></svg>
    </div>
    <div>
      <h1><span class="vs-i">Two Stone</span> <span class="vs-j">Showdown</span></h1>
      <div class="sub" id="sub"></div>
    </div>
  </header>

  <div id="demoNote"></div>
  <div class="status" id="status"></div>
  <div id="banner"></div>

  <div class="players" id="players"></div>

  <div class="stack">
    <section class="card">
      <div class="sec-h">
        <h3>The race</h3>
        <div class="toggle" id="modeToggle">
          <button data-m="lost" class="on">Weight lost</button>
          <button data-m="weight">Actual weight</button>
        </div>
      </div>
      <div class="chart-box"><canvas id="chart"></canvas></div>
      <div class="legend" id="legend"></div>
    </section>

    <section class="card">
      <div class="sec-h"><h3>Weekly weigh-ins</h3></div>
      <div class="table-wrap"><table id="table"></table></div>
    </section>
  </div>

  <footer>
    Weigh in every Monday morning · same scales, same time, before breakfast
  </footer>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   CONFIG — the only bit you need to edit
   ============================================================ */
const CONFIG = {
  SHEET_ID:   '1ZPRvogV7KULM2pvnHugCaVm9552Y20eSz-WVjZ7x7w4',        // Google Sheet ID (the long bit in the sheet URL)
  SHEET_TAB:  '',          // leave blank to use the first tab, or put an exact tab name
  START_DATE: '2026-10-05',// Monday of the first weigh-in (week 0)
  WEEKS:      9,
  TARGET_LBS: 28,          // 2 stone
  PLAYERS: [
    { key: 'Ian', name: 'Ian Cassidy', colour: '#2f7bff' },
    { key: 'Joe', name: 'Joe Moring',  colour: '#ff3b47' },
    { key: 'Sam', name: 'Sam',         colour: '#2fd18b' }
  ]
};
/* ============================================================ */

const WEEK_MS = 7 * 864e5;
const START = new Date(CONFIG.START_DATE + 'T00:00:00');
const qs = new URLSearchParams(location.search);
const DEMO = qs.has('demo') || !CONFIG.SHEET_ID;
const CACHE_KEY = 'tss-cache-v1:' + CONFIG.SHEET_ID;
let chart, mode = 'lost', rows = [], model = null;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const weekDate = w => new Date(START.getTime() + w * WEEK_MS);
const fmtDate = d => d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
const half = n => Math.round(n * 2) / 2;
const n1 = n => { const v = half(n); return Number.isInteger(v) ? String(v) : v.toFixed(1); };
function fmtSt(lbs) {
  if (lbs == null) return '—';
  const t = half(lbs), st = Math.floor(t / 14), lb = t - st * 14;
  return `${st}st ${n1(lb)}lb`;
}
function fmtLoss(lbs) {
  if (lbs == null) return '—';
  const t = half(Math.abs(lbs));
  if (t < 14) return `${n1(t)}lb`;
  const st = Math.floor(t / 14), lb = t - st * 14;
  return lb ? `${st}st ${n1(lb)}lb` : `${st}st`;
}

function bigSt(lbs) {
  const t = half(Math.max(0, lbs)), st = Math.floor(t / 14), lb = t - st * 14;
  if (!st) return `${n1(lb)}<small>lb</small>`;
  return `${st}<small>st</small>${lb ? ` ${n1(lb)}<small>lb</small>` : ''}`;
}

/* Accepts: 230 · 230lb · 16st 4 · 16st 4lb · 16 4 · 16.5 (stone) · 104.5kg */
function parseWeight(v) {
  if (v == null) return null;
  const s = String(v).trim().toLowerCase().replace(/,/g, ' ');
  if (!s) return null;
  let m;
  if ((m = s.match(/^([\d.]+)\s*kgs?$/))) return +m[1] * 2.20462;
  if ((m = s.match(/^([\d.]+)\s*(?:lb|lbs|pounds)$/))) return +m[1];
  if ((m = s.match(/^([\d.]+)\s*(?:st|stone|stones)\s*([\d.]+)?\s*(?:lb|lbs|pounds)?$/))) return +m[1] * 14 + (+m[2] || 0);
  if ((m = s.match(/^(\d{1,2})\s+([\d.]+)$/))) return +m[1] * 14 + +m[2];
  if ((m = s.match(/^[\d.]+$/))) { const n = +s; return n > 45 ? n : n * 14; }
  return null;
}

function parseCSV(text) {
  const out = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i+1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i+1] === '\n') i++; row.push(cur); out.push(row); row = []; cur = ''; }
    else cur += c;
  }
  if (cur || row.length) { row.push(cur); out.push(row); }
  return out.filter(r => r.some(x => x.trim() !== ''));
}

function weekFromDate(d) {
  return Math.max(0, Math.min(CONFIG.WEEKS, Math.round((d - START) / WEEK_MS)));
}

function parseWeek(v) {
  const s = String(v == null ? '' : v).trim().toLowerCase();
  if (!s) return null;
  if (/start/.test(s)) return 0;
  const m = s.match(/\d+/);
  if (!m) return null;
  const n = +m[0];
  return n >= 0 && n <= CONFIG.WEEKS ? n : null;
}

/* Reads either layout:
   Grid (the simple one):  Week | Ian | Joe      → one row per week, one column per person
   Log:                    Timestamp | Name | Week | Lbs
   Latest entry per person per week wins. */
function rowsFromCSV(text) {
  const grid = parseCSV(text);
  if (!grid.length) return [];
  const head = grid[0].map(h => h.trim().toLowerCase());
  const col = k => head.indexOf(k);
  if (col('name') < 0) {
    const iWk = head.findIndex(x => x === 'week' || x === 'wk');
    const skip = new Set([iWk, col('date'), col('timestamp'), col('notes')]);
    const out = [];
    grid.slice(1).forEach((r, idx) => {
      const week = iWk >= 0 ? parseWeek(r[iWk]) : (idx <= CONFIG.WEEKS ? idx : null);
      if (week == null) return;
      grid[0].forEach((label, c) => {
        if (skip.has(c) || !label.trim()) return;
        const lbs = parseWeight(r[c]);
        if (lbs && lbs > 60 && lbs < 600) out.push({ ts: idx, order: idx, name: label.trim(), week, lbs });
      });
    });
    return out;
  }
  const iT = col('timestamp'), iN = col('name'), iW = col('week'), iL = col('lbs') >= 0 ? col('lbs') : col('weight');
  return grid.slice(1).map((r, idx) => {
    const ts = iT >= 0 ? new Date(r[iT]) : null;
    const lbs = parseWeight(r[iL]);
    let week = iW >= 0 && r[iW] !== '' ? parseInt(r[iW], 10) : NaN;
    if (isNaN(week) && ts && !isNaN(ts)) week = weekFromDate(ts);
    return { ts: ts && !isNaN(ts) ? ts.getTime() : idx, order: idx, name: (r[iN] || '').trim(), week, lbs };
  }).filter(r => r.name && r.lbs && r.lbs > 60 && r.lbs < 600 && r.week >= 0 && r.week <= CONFIG.WEEKS);
}

function demoRows() {
  const nowWeek = Math.max(4, Math.min(CONFIG.WEEKS, Math.floor((Date.now() - START) / WEEK_MS)));
  const seeds = { Ian: [240, [3.5, 2, 3, 1, 2.5, 3, 0.5, 2.5, 3]], Joe: [229, [4.5, 1.5, 2, 2.5, -0.5, 3.5, 2, 3, 2.5]], Sam: [252, [5, 2.5, 1, 3, 2, 1.5, 3, 2, 2.5]] };
  const out = [];
  for (const p of CONFIG.PLAYERS) {
    const s = seeds[p.key] || [220, [2,2,2,2,2,2,2,2,2]];
    let w = s[0];
    for (let wk = 0; wk <= nowWeek; wk++) {
      if (wk > 0) w -= s[1][wk - 1];
      out.push({ ts: wk, order: wk, name: p.key, week: wk, lbs: w });
    }
  }
  return out;
}

function buildModel(rs) {
  // players = config players + any extra names found in the sheet (never trust a hard-coded list alone)
  const players = CONFIG.PLAYERS.map(p => ({ ...p }));
  const extraCols = ['#ffc94d', '#b48cff', '#ff8ad8', '#4dd6ff'];
  const findP = n => players.find(p => p.key.toLowerCase() === n.toLowerCase() || p.name.toLowerCase() === n.toLowerCase()
    || p.name.toLowerCase().split(' ')[0] === n.toLowerCase().split(' ')[0]);
  rs.forEach(r => { if (!findP(r.name)) players.push({ key: r.name, name: r.name, colour: extraCols[(players.length - CONFIG.PLAYERS.length) % extraCols.length] }); });

  players.forEach(p => {
    const series = Array(CONFIG.WEEKS + 1).fill(null), stamp = Array(CONFIG.WEEKS + 1).fill(-Infinity);
    rs.filter(r => findP(r.name) === p).forEach(r => {
      const key = r.ts * 1e4 + r.order;
      if (key >= stamp[r.week]) { stamp[r.week] = key; series[r.week] = r.lbs; }
    });
    p.series = series;
    const idxs = series.map((v, i) => v != null ? i : -1).filter(i => i >= 0);
    p.start = idxs.length ? series[idxs[0]] : null;
    p.latestWeek = idxs.length ? idxs[idxs.length - 1] : null;
    p.latest = idxs.length ? series[p.latestWeek] : null;
    p.lost = p.start != null ? p.start - p.latest : null;
    p.toGo = p.lost != null ? Math.max(0, CONFIG.TARGET_LBS - p.lost) : CONFIG.TARGET_LBS;
    p.pct = p.lost != null ? Math.max(0, Math.min(100, p.lost / CONFIG.TARGET_LBS * 100)) : 0;
    p.bodyPct = p.lost != null && p.start ? p.lost / p.start * 100 : null;
    p.weekly = series.map((v, i) => (i > 0 && v != null && series[i - 1] != null) ? series[i - 1] - v : null);
    const best = p.weekly.reduce((b, v, i) => v != null && (b == null || v > p.weekly[b]) ? i : b, null);
    p.bestWeek = best;
  });
  const ranked = players.filter(p => p.lost != null).sort((a, b) => b.lost - a.lost);
  const leader = ranked.length > 1 && ranked[0].lost - ranked[1].lost >= 0.25 ? ranked[0] : null;
  return { players, ranked, leader };
}

/* ---------------- rendering ---------------- */
function timeline() {
  const days = Math.floor((Date.now() - START) / 864e5);
  const end = weekDate(CONFIG.WEEKS);
  if (days < 0) return { phase: 'pre', days: -days, nowIdx: 0 };
  if (days > CONFIG.WEEKS * 7) return { phase: 'done', nowIdx: CONFIG.WEEKS, end };
  const wk = Math.floor(days / 7);
  return { phase: 'live', weighInToday: days % 7 === 0, weekLabel: Math.min(CONFIG.WEEKS, wk + 1),
           next: weekDate(Math.min(CONFIG.WEEKS, wk + (days % 7 === 0 ? 0 : 1))), nowIdx: Math.min(CONFIG.WEEKS, Math.round(days / 7)),
           daysToNext: (7 - days % 7) % 7 };
}

function render() {
  model = buildModel(rows);
  const t = timeline();
  const names = CONFIG.PLAYERS.map(p => p.name.split(' ')[0]).join(' vs ');
  $('sub').textContent = `${names} · ${CONFIG.WEEKS} weeks · ${fmtDate(START)} – ${fmtDate(weekDate(CONFIG.WEEKS))} 2026`;
  $('demoNote').innerHTML = DEMO ? `<div class="demo">Preview with made-up numbers.</div>` : '';

  // status pills
  let pills = '';
  if (t.phase === 'pre') pills = `<span class="pill hot">Kick-off in <b>${t.days} day${t.days === 1 ? '' : 's'}</b></span><span class="pill">First weigh-in <b>${fmtDate(START)}</b></span>`;
  else if (t.phase === 'done') pills = `<span class="pill hot"><b>Final whistle</b></span>`;
  else pills = `<span class="pill"><b>Week ${t.weekLabel}</b> of ${CONFIG.WEEKS}</span>` +
    (t.weighInToday ? `<span class="pill hot"><b>Weigh-in day</b> ⚖️</span>` : `<span class="pill">Next weigh-in <b>${fmtDate(t.next)}</b> · ${t.daysToNext}d</span>`);
  pills += `<span class="pill">Target <b>${fmtLoss(CONFIG.TARGET_LBS)}</b> each</span>`;
  $('status').innerHTML = pills;

  // banner
  const { leader, ranked } = model;
  let b;
  if (!ranked.length) b = { c: '#ffc94d', ico: '⚖️', t: 'Weigh-in <em>Monday</em>', s: `Starting weights go in on ${fmtDate(START)}. No hiding from the scales.` };
  else if (ranked.length < 2) b = { c: ranked[0].colour, ico: '⏳', t: `<em>${esc(ranked[0].name.split(' ')[0])}</em> is on the board`, s: 'Waiting for the other starting weights.' };
  else if (!leader) b = { c: '#ffc94d', ico: '🤝', t: '<em>Dead level</em>', s: `Both down ${fmtLoss(ranked[0].lost)}. Everything to play for.` };
  else {
    const gap = leader.lost - ranked[1].lost, first = leader.name.split(' ')[0];
    const finished = t.phase === 'done';
    const champ = model.players.filter(p => p.lost >= CONFIG.TARGET_LBS);
    b = { c: leader.colour, ico: finished ? '🏆' : '🔥',
      t: finished ? `<em>${esc(first)}</em> wins` : `<em>${esc(first)}</em> leads by ${fmtLoss(gap)}`,
      s: champ.length ? `${champ.map(p => p.name.split(' ')[0]).join(' & ')} ${champ.length > 1 ? 'have' : 'has'} hit the 2 stone target 🎯` :
         `${esc(first)} down ${fmtLoss(leader.lost)}, ${esc(ranked[1].name.split(' ')[0])} down ${fmtLoss(ranked[1].lost)}.` };
  }
  $('banner').innerHTML = `<div class="banner" style="--lc:${b.c}"><div class="ico">${b.ico}</div><div><div class="t">${b.t}</div><div class="s">${b.s}</div></div></div>` +
    (ranked.length ? `<button class="share" id="shareBtn">Share standings on WhatsApp</button>` : '');
  if (ranked.length) $('shareBtn').onclick = () => {
    const wk = Math.max(...model.players.map(p => p.latestWeek ?? 0));
    const lines = model.players.filter(p => p.lost != null).map(p => `${p.name.split(' ')[0]}: down ${fmtLoss(Math.max(0, p.lost))}, ${p.toGo ? fmtLoss(p.toGo) + ' to go' : '2 stone DONE 🎯'}`);
    const lead = leader ? `${leader.name.split(' ')[0]} leads by ${fmtLoss(leader.lost - ranked[1].lost)} 🔥` : (ranked.length > 1 ? 'Dead level 🤝' : '');
    const text = `⚖️ Two Stone Showdown · ${wk === 0 ? 'Starting weigh-in' : 'Week ' + wk}\n${lines.join('\n')}${lead ? '\n' + lead : ''}\n${location.origin}${location.pathname}`;
    window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
  };

  // player cards
  $('players').innerHTML = model.players.map(p => {
    const has = p.lost != null;
    return `<article class="card player" style="--c:${p.colour}">
      <div class="p-head"><span class="dot"></span><h2>${esc(p.name)}</h2>${leader === p ? '<span class="crown">LEADING</span>' : ''}</div>
      <div class="big"><span class="num">${has ? bigSt(p.lost) : '—'}</span><span class="unit">lost</span></div>
      <div class="alt">${has && p.lost < 0 ? `Up ${fmtLoss(p.lost)} 😬` : has ? '' : 'Awaiting first weigh-in'}</div>
      <div class="bar"><i style="width:${p.pct}%"></i></div>
      <div class="bar-l"><span>${Math.round(p.pct)}%</span><span>2 stone</span></div>
      <dl>
        <dt>Start</dt><dd>${fmtSt(p.start)}</dd>
        <dt>Now</dt><dd>${fmtSt(p.latest)}</dd>
        <dt>To go</dt><dd>${has ? (p.toGo ? fmtLoss(p.toGo) : 'Done 🎯') : fmtLoss(CONFIG.TARGET_LBS)}</dd>
        <dt>Body weight</dt><dd>${p.bodyPct != null ? '−' + p.bodyPct.toFixed(1) + '%' : '—'}</dd>
        <dt>Best week</dt><dd>${p.bestWeek != null && p.weekly[p.bestWeek] > 0 ? `W${p.bestWeek} (${fmtLoss(p.weekly[p.bestWeek])})` : '—'}</dd>
      </dl>
    </article>`;
  }).join('') + (model.players.length === 2 ? '<div class="vs">VS</div>' : '');
  $('players').dataset.n = model.players.length;

  renderTable(t);
  renderChart();
}

function renderTable(t) {
  const P = model.players;
  let h = `<thead><tr><th>Week</th>${P.map(p => `<th style="color:${p.colour}">${esc(p.name.split(' ')[0])}</th>`).join('')}<th>Week winner</th></tr></thead><tbody>`;
  for (let w = 0; w <= CONFIG.WEEKS; w++) {
    const d = weekDate(w), future = d > Date.now() && P.every(p => p.series[w] == null);
    const isNow = t.phase === 'live' && t.nowIdx === w;
    h += `<tr class="${future ? 'future' : ''} ${isNow ? 'now' : ''}"><td><span class="wk">${w === 0 ? 'START' : 'W' + w}</span><span class="dt">${fmtDate(d)}</span></td>`;
    P.forEach(p => {
      const v = p.series[w], c = p.weekly[w];
      h += `<td>${v != null ? fmtSt(v) : '—'}${c != null ? `<span class="chg ${c >= 0 ? 'down' : 'up'}">${c >= 0 ? '−' : '+'}${fmtLoss(c)}</span>` : ''}</td>`;
    });
    const contenders = P.filter(p => p.weekly[w] != null);
    let win = '—';
    if (w > 0 && contenders.length === P.length && P.length > 1) {
      const top = [...contenders].sort((a, b) => b.weekly[w] - a.weekly[w]);
      win = top[0].weekly[w] - top[1].weekly[w] < 0.25 ? 'Tied' :
        `<span class="win" style="--c:${top[0].colour}"><i></i>${esc(top[0].name.split(' ')[0])}</span>`;
    }
    h += `<td>${win}</td></tr>`;
  }
  $('table').innerHTML = h + '</tbody>';
}

function renderChart() {
  const P = model.players, W = CONFIG.WEEKS;
  const labels = Array.from({ length: W + 1 }, (_, i) => i === 0 ? 'Start' : 'W' + i);
  const ds = [];
  if (mode === 'lost') {
    ds.push({ label: 'Target pace', data: labels.map((_, i) => CONFIG.TARGET_LBS * i / W), borderColor: 'rgba(255,255,255,.35)',
      borderDash: [6, 5], borderWidth: 2, pointRadius: 0, fill: false, tension: 0, order: 9 });
    P.forEach(p => ds.push({ label: p.name, data: p.series.map(v => v != null && p.start != null ? +(p.start - v).toFixed(1) : null),
      borderColor: p.colour, backgroundColor: p.colour + '22', pointBackgroundColor: p.colour, borderWidth: 3.5,
      pointRadius: 5, pointHoverRadius: 7, tension: .3, spanGaps: true, fill: false }));
  } else {
    P.forEach(p => {
      ds.push({ label: p.name, data: p.series.map(v => v != null ? +v.toFixed(1) : null), borderColor: p.colour,
        pointBackgroundColor: p.colour, borderWidth: 3.5, pointRadius: 5, pointHoverRadius: 7, tension: .3, spanGaps: true });
      if (p.start != null) ds.push({ label: p.name.split(' ')[0] + ' target', data: labels.map((_, i) => +(p.start - CONFIG.TARGET_LBS * i / W).toFixed(1)),
        borderColor: p.colour + '66', borderDash: [6, 5], borderWidth: 2, pointRadius: 0, tension: 0 });
    });
  }
  const grid = 'rgba(255,255,255,.06)', tick = '#8b93a3';
  const yLost = { min: Math.min(0, ...ds.flatMap(d => d.data).filter(v => v != null)), suggestedMax: CONFIG.TARGET_LBS + 2,
    ticks: { color: tick, callback: v => v === 0 ? '0' : (v < 0 ? '+' : '') + fmtLoss(v), stepSize: 7 }, grid: { color: grid } };
  const yWt = { ticks: { color: tick, callback: v => fmtSt(v).replace(' 0lb', ''), stepSize: 7 }, grid: { color: grid } };
  const cfg = {
    type: 'line', data: { labels, datasets: ds },
    options: {
      responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      animation: { duration: 700 },
      plugins: { legend: { display: false },
        tooltip: { backgroundColor: '#11141b', borderColor: 'rgba(255,255,255,.12)', borderWidth: 1, padding: 12,
          titleFont: { family: 'Manrope', weight: '800' }, bodyFont: { family: 'Manrope', weight: '600' },
          callbacks: {
            title: items => { const i = items[0].dataIndex; return `${labels[i]} · ${fmtDate(weekDate(i))}`; },
            label: c => c.raw == null ? null : `${c.dataset.label}: ${mode === 'lost' ? fmtLoss(c.raw) + (c.raw < 0 ? ' up' : ' lost') : fmtSt(c.raw)}`
          } } },
      scales: { x: { ticks: { color: tick, font: { weight: '700' } }, grid: { display: false } }, y: mode === 'lost' ? yLost : yWt }
    }
  };
  if (chart) chart.destroy();
  chart = new Chart($('chart'), cfg);
  $('legend').innerHTML = P.map(p => `<span style="--c:${p.colour}"><i></i>${esc(p.name)}</span>`).join('') +
    (mode === 'lost' ? `<span style="--c:rgba(255,255,255,.5)"><i class="dash"></i>Target pace (2st in ${W} wks)</span>`
                     : `<span style="--c:rgba(255,255,255,.5)"><i class="dash"></i>Target line</span>`);
}

/* ---------------- data: cache-then-refresh ---------------- */
async function load() {
  if (DEMO) { rows = demoRows(); render(); return; }
  try {
    const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
    if (c && c.csv) { rows = rowsFromCSV(c.csv); render(); }
  } catch (e) {}
  if (!model) render();
  const ctrl = new AbortController(), to = setTimeout(() => ctrl.abort(), 15000);
  try {
    const url = `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:csv&headers=1${CONFIG.SHEET_TAB ? '&sheet=' + encodeURIComponent(CONFIG.SHEET_TAB) : ''}&_=${Date.now()}`;
    const res = await fetch(url, { signal: ctrl.signal, cache: 'no-store' });
    const csv = await res.text();
    if (!res.ok || /<html/i.test(csv.slice(0, 200))) throw new Error('Sheet not reachable — check sharing is "Anyone with the link → Viewer"');
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ csv, at: Date.now() })); } catch (e) {}
    rows = rowsFromCSV(csv); render();
  } catch (e) {
    console.warn(e); if (!rows.length) toast(e.name === 'AbortError' ? 'Sheet is slow to respond — showing cached data' : e.message);
  } finally { clearTimeout(to); }
}

$('modeToggle').querySelectorAll('button').forEach(b => b.onclick = () => {
  mode = b.dataset.m; $('modeToggle').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); renderChart();
});

function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 3500); }

load();
if (!DEMO) setInterval(() => { if (!document.hidden) load(); }, 120000);
</script>
